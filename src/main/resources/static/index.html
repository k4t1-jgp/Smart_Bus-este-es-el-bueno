<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartBus Control</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23F2B705'/><rect x='7' y='8' width='18' height='14' rx='3' fill='%231F3347'/><rect x='9' y='10' width='14' height='5' fill='%23F2B705'/><circle cx='11' cy='24' r='2' fill='%231F3347'/><circle cx='21' cy='24' r='2' fill='%231F3347'/></svg>">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ============ PANTALLA DE INICIO DE SESIÓN ============ -->
  <section id="pantalla-login" class="login" hidden>
    <div class="login-marco">
      <div class="login-marca">
        <span class="logo-bus" aria-hidden="true"></span>
        <div>
          <h1>SmartBus Control</h1>
          <p>Sistema escolar de transporte</p>
        </div>
      </div>

      <form id="form-login" class="login-form" autocomplete="on">
        <h2>Iniciar sesión</h2>
        <label>Usuario
          <input name="nombreUsuario" required autocomplete="username">
        </label>
        <label>Contraseña
          <input name="contrasena" type="password" required autocomplete="current-password">
        </label>
        <button class="btn btn-primario btn-ancho" type="submit">Entrar</button>
        <p class="login-error" id="login-error" role="alert"></p>
      </form>

      <!-- Solo aparece si la base de datos todavía no tiene usuarios -->
      <form id="form-primer-admin" class="login-form login-inicial" hidden>
        <h2>Primer uso</h2>
        <p class="ayuda">La base de datos no tiene usuarios. Cree el administrador para empezar;
          también se crearán los cinco roles del acta.</p>
        <label>Usuario administrador
          <input name="nombreUsuario" value="admin" required>
        </label>
        <label>Contraseña
          <input name="contrasena" type="password" required minlength="4">
        </label>
        <button class="btn btn-primario btn-ancho" type="submit">Crear administrador</button>
      </form>
    </div>
  </section>

  <!-- ============ APLICACIÓN (después del login) ============ -->
  <div id="app" class="app" hidden>
    <header class="barra-superior">
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="marca">
        <span class="logo-bus pequeno" aria-hidden="true"></span>
        <span>SmartBus Control</span>
      </div>
      <div class="usuario-actual">
        <span class="avatar" id="avatar"></span>
        <span>
          <strong id="usuario-nombre"></strong>
          <small id="usuario-rol"></small>
        </span>
      </div>
    </header>

    <nav class="menu-lateral" id="menu-lateral" aria-label="Módulos">
      <ul id="lista-menu"></ul>
      <button class="menu-salir" id="btn-salir">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Cerrar sesión
      </button>
    </nav>

    <main class="contenido" id="contenido" tabindex="-1"></main>
  </div>

  <div class="avisos" id="avisos" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/modulos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

# ---------------------------------------------------------------
# Configuración de SmartBus Control
# ---------------------------------------------------------------
spring.application.name=smartbus-api

# Puerto donde corre la API: http://localhost:8080
server.port=8080

# Conexión a MySQL.
#  - createDatabaseIfNotExist=true: crea la base "smart_bus" sola si no existe.
#  - Cambie usuario/contraseña por los de SU MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/Smart_Bus_db?createDatabaseIfNotExist=true&serverTimezone=America/Guatemala&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Katherine

# JPA / Hibernate
#  - update: crea las tablas si no existen y agrega columnas nuevas, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que ejecuta Hibernate (útil para aprender y depurar).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita un aviso de Spring; nuestras entidades no usan carga perezosa.
spring.jpa.open-in-view=false

